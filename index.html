<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <script src="./script.js" defer></script>
  <link rel="stylesheet" type="text/css" href="./styles.css">
</head>

<body>
  <h1>My Library</h1>
  <div>
    <form method="post">
      <p>
        <label for="title">
          <span>Title: *</span>
          <input id="title" type="text" name="title" required>
          <span class="error" aria-live="polite"></span>
        </label>
      </p>
      <p>
        <label for="author">
          <span>Author: *</span>
          <input id="author" type="text" name="author" required>
          <span class="error" aria-live="polite"></span>
        </label>
      </p>
      <p>
        <label for="pages">
          <span>Pages: *</span>
          <input id="pages" type="number" name="pages" required min="1">
          <span class="error" aria-live="polite"></span>
        </label>
      </p>
      <p>
        <label for="have_read">
          <span>Have read: </span>
          <input id="have_read" type="checkbox" name="have_read">
          <span class="error" aria-live="polite"></span>
        </label>
      </p>
      <button type="submit" action="">Add to my Library</button>
    </form>
    <table>
      <thead>
        <th>Title</th>
        <th>Author</th>
        <th>Pages</th>
        <th>Have read</th>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <button class="new">New book</button>
</body>

</html>
