<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <script src="./script.js" defer></script>
  <link rel="stylesheet" type="text/css">
</head>
<body>
  <h1>My Library</h1>
  <form method="post">
    <label for="title">Title</label>
    <input id="title" type="text" name="title" required>
    <label for="author">Author</label>
    <input id="author" type="text" name="author" required>
    <label for="pages">Pages</label>
    <input id="pages" type="number" name="pages" required min="1">
    <label for="have_read">Have read</label>
    <input id="have_read" type="checkbox" name="have_read">
    <button type="submit" action="">Add to my Library</button>
  </form>
  <table>
    <thead>
      <th>Title</th>
      <th>Author</th>
      <th>Pages</th>
      <th>Have read</th>
   </thead>
   <tbody></tbody>
  </table>
  <button class="new">New book</button>
</body>
</html>
